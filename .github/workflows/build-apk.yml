name: Build Android APK (Buildozer)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Python to Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP Archive (If Present)
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Mengekstrak $z..."
            unzip -o "$z" -d .
          done
          # Jika hasil ekstrak berada di dalam subfolder dan buildozer.spec ada di dalamnya, pindahkan ke root
          if [ ! -f "buildozer.spec" ]; then
            SPEC_FILE=$(find . -maxdepth 3 -name "buildozer.spec" | head -n 1)
            if [ -n "$SPEC_FILE" ]; then
              SPEC_DIR=$(dirname "$SPEC_FILE")
              echo "Memindahkan isi proyek dari $SPEC_DIR ke root..."
              shopt -s dotglob
              mv "$SPEC_DIR"/* .
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer Directories
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install System & Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            gettext \
            ccache
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer Cython==0.29.33 virtualenv

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytscraperplayer-debug-apk
          path: bin/*.apk
          if-no-files-found: error
