name: Extract ZIP Archive

# Trigger workflow saat ada push file .zip atau dijalankan manual dari tab Actions
on:
  push:
    branches:
      - main
    paths:
      - '**.zip'
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'ytdl-apk-project.zip'
        required: true
        default: 'ytdl-apk-project.zip'
      output_dir:
        description: 'main'
        required: true
        default: './main'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Ekstrak file ZIP menggunakan perintah unzip bawaan runner Ubuntu
      - name: Extract ZIP File
        env:
          ZIP_FILE: ${{ github.event.inputs.zip_path || 'ytdl-apk-project.zip' }}
          DEST_DIR: ${{ github.event.inputs.output_dir || './main' }}
        run: |
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Error: File $ZIP_FILE tidak ditemukan!"
            exit 1
          fi
          mkdir -p "$DEST_DIR"
          unzip -o "$ZIP_FILE" -d "$DEST_DIR"
          echo "Berhasil mengekstrak $ZIP_FILE ke $DEST_DIR"
          ls -la "$DEST_DIR"

      # 3. (Opsional) Commit & push hasil ekstraksi kembali ke repository
      - name: Commit and Push Extracted Files
        env:
          DEST_DIR: ${{ github.event.inputs.output_dir || './main' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEST_DIR"
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan file baru untuk di-commit."
          else
            git commit -m "chore: extract zip archive to $DEST_DIR"
            git push
          fi
